<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>바이브코딩 기획 도우미</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<style>
  :root{
    --ink:#1f2933; --sub:#5f6b76; --line:#e3e8ee; --bg:#f6f8fb; --card:#fff;
    --accent:#2f6fed; --accent-dark:#2159c8; --accent-soft:#eaf1ff;
    --ok:#1f9d63; --ok-soft:#e6f6ee; --warn:#d64545; --warn-soft:#fdeaea;
    --yellow:#fff3d6; --yellow-line:#e8c266;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  html{scroll-behavior:smooth;}
  body{
    font-family:"Pretendard","Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",sans-serif;
    font-size:17px;line-height:1.65;color:var(--ink);background:var(--bg);
    -webkit-text-size-adjust:100%;
  }
  button{font-family:inherit;cursor:pointer;}
  input,textarea{font-family:inherit;font-size:17px;color:var(--ink);}
  header{position:sticky;top:0;z-index:20;background:#fff;border-bottom:1px solid var(--line);}
  .head-in{max-width:1080px;margin:0 auto;padding:12px 18px;display:flex;align-items:center;justify-content:space-between;gap:10px;}
  .brand{font-weight:800;font-size:17px;letter-spacing:-.2px;}
  .brand small{font-weight:600;color:var(--sub);font-size:13px;margin-left:8px;}
  .head-btns{display:flex;gap:6px;}
  .head-btns button{font-size:13.5px;padding:6px 12px;border:1px solid var(--line);border-radius:8px;background:#fff;color:var(--sub);}
  .head-btns button:hover{border-color:var(--accent);color:var(--accent);}
  .head-btns button.danger{border-color:var(--warn);color:var(--warn);background:var(--warn-soft);}
  .progress{height:4px;background:var(--line);}
  .progress > div{height:100%;background:var(--accent);width:0;transition:width .3s;}

  main{max-width:1080px;margin:0 auto;padding:26px 18px 90px;}
  .layout{display:grid;grid-template-columns:1fr 320px;gap:24px;align-items:start;}
  @media (max-width:860px){.layout{grid-template-columns:1fr;} aside{order:2;} aside .card{position:static;} }
  @media (max-width:560px){.brand small{display:none;} h1{font-size:26px;} .card{padding:20px 18px;} }

  .card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:26px;box-shadow:0 2px 10px rgba(20,40,80,.05);}
  .step-tag{display:inline-block;font-size:13px;font-weight:700;color:var(--accent);background:var(--accent-soft);border-radius:99px;padding:3px 12px;margin-bottom:10px;}
  h1{font-size:30px;font-weight:800;letter-spacing:-.5px;line-height:1.3;margin-bottom:8px;}
  h2{font-size:23px;font-weight:800;letter-spacing:-.3px;line-height:1.35;margin-bottom:6px;}
  .hint{color:var(--sub);font-size:15px;margin-bottom:18px;}

  /* 옵션 */
  .opts{display:grid;gap:10px;}
  .opts.grid2{grid-template-columns:1fr 1fr;}
  @media (max-width:560px){.opts.grid2{grid-template-columns:1fr;}}
  .opt{
    text-align:left;border:2px solid var(--line);border-radius:12px;background:#fff;padding:13px 16px;
    font-size:16.5px;line-height:1.45;transition:all .12s;display:flex;gap:12px;align-items:flex-start;width:100%;
  }
  .opt:hover{border-color:var(--accent);background:#f7faff;}
  .opt.on{border-color:var(--accent);background:var(--accent-soft);}
  .opt .em{font-size:24px;line-height:1.2;flex:0 0 auto;}
  .opt .lb{font-weight:700;}
  .opt .ds{display:block;color:var(--sub);font-size:14px;font-weight:500;margin-top:2px;}
  .opt .chk{flex:0 0 auto;width:22px;height:22px;border:2px solid #c9d2dc;border-radius:6px;margin-top:2px;position:relative;}
  .opt.on .chk{border-color:var(--accent);background:var(--accent);}
  .opt.on .chk::after{content:"";position:absolute;left:6px;top:2px;width:6px;height:11px;border:solid #fff;border-width:0 2.5px 2.5px 0;transform:rotate(45deg);}
  .opt.custom{border-style:dashed;}
  .custom-box{margin-top:6px;}
  .inp{width:100%;border:2px solid var(--line);border-radius:12px;padding:12px 14px;background:#fff;outline:none;}
  .inp:focus{border-color:var(--accent);}
  textarea.inp{min-height:110px;resize:vertical;line-height:1.6;}
  .example{margin-top:10px;font-size:14.5px;color:var(--sub);}
  .example b{color:var(--ink);}
  .ex-chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px;}
  .ex-chips button{font-size:13.5px;padding:5px 11px;border-radius:99px;border:1px solid var(--line);background:#fff;color:var(--sub);}
  .ex-chips button:hover{border-color:var(--accent);color:var(--accent);}

  .nav-row{display:flex;justify-content:space-between;align-items:center;margin-top:22px;gap:10px;}
  .btn{border:none;border-radius:12px;padding:12px 22px;font-size:16.5px;font-weight:700;}
  .btn.primary{background:var(--accent);color:#fff;}
  .btn.primary:hover{background:var(--accent-dark);}
  .btn.primary:disabled{background:#b9c7e2;cursor:not-allowed;}
  .btn.ghost{background:transparent;color:var(--sub);border:1px solid var(--line);}
  .btn.ghost:hover{border-color:var(--sub);color:var(--ink);}
  .key-hint{font-size:13px;color:#9aa5b1;}

  /* 사이드 요약 */
  aside .card{padding:18px 20px;position:sticky;top:78px;}
  aside h3{font-size:15px;font-weight:800;color:var(--sub);margin-bottom:10px;letter-spacing:.3px;}
  .sum-list{display:flex;flex-direction:column;gap:6px;}
  .sum-item{border-radius:10px;padding:8px 10px;background:#f8fafc;border:1px solid transparent;cursor:pointer;}
  .sum-item:hover{border-color:var(--accent);}
  .sum-item .k{font-size:12.5px;color:var(--sub);font-weight:600;}
  .sum-item .v{font-size:14.5px;font-weight:600;word-break:keep-all;}
  .sum-empty{font-size:14px;color:#9aa5b1;}

  /* 시작 화면 */
  .intro-steps{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin:20px 0 24px;}
  @media (max-width:560px){.intro-steps{grid-template-columns:1fr;}}
  .intro-step{background:#f8fafc;border:1px solid var(--line);border-radius:12px;padding:14px;}
  .intro-step .n{display:inline-block;width:26px;height:26px;border-radius:50%;background:var(--accent);color:#fff;font-weight:800;font-size:14px;text-align:center;line-height:26px;margin-bottom:6px;}
  .intro-step b{display:block;font-size:15.5px;}
  .intro-step span{font-size:14px;color:var(--sub);}

  /* 결과 */
  .result h2{margin-bottom:14px;}
  .plan-table{width:100%;border-collapse:collapse;font-size:15.5px;margin-bottom:6px;}
  .plan-table th{text-align:left;width:120px;color:var(--sub);font-weight:600;padding:8px 10px 8px 0;vertical-align:top;border-bottom:1px solid var(--line);}
  .plan-table td{padding:8px 0;border-bottom:1px solid var(--line);word-break:keep-all;}
  .prompt-wrap{position:relative;margin-top:14px;}
  pre.prompt{
    white-space:pre-wrap;word-break:keep-all;background:#1e2530;color:#e9eef5;border-radius:14px;
    padding:22px 22px 26px;font-family:"Pretendard","Malgun Gothic",sans-serif;font-size:15.5px;line-height:1.7;
  }
  .copy-btn{position:absolute;top:12px;right:12px;font-size:13.5px;padding:7px 13px;border-radius:8px;border:none;background:#fff;color:var(--ink);font-weight:700;}
  .copy-btn.done{background:var(--ok);color:#fff;}
  .follow{display:flex;flex-direction:column;gap:8px;margin-top:12px;}
  .follow-item{display:flex;gap:10px;align-items:center;background:#f8fafc;border:1px solid var(--line);border-radius:12px;padding:12px 14px;}
  .follow-item code{flex:1;font-family:inherit;font-size:15.5px;word-break:keep-all;}
  .follow-item button{font-size:13px;padding:6px 11px;border-radius:8px;border:1px solid var(--line);background:#fff;flex:0 0 auto;}
  .follow-item button.done{background:var(--ok);color:#fff;border-color:var(--ok);}
  .result-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:22px;}
  .tip{background:var(--yellow);border:1px solid var(--yellow-line);border-radius:12px;padding:14px 16px;font-size:15px;margin-top:22px;}
  .tip b{display:block;margin-bottom:4px;}
  .sec-h{font-size:18px;font-weight:800;margin:28px 0 6px;}
  .sec-h small{font-weight:500;color:var(--sub);font-size:14px;margin-left:6px;}
  .toast{
    position:fixed;left:50%;bottom:28px;transform:translateX(-50%) translateY(20px);opacity:0;pointer-events:none;
    background:#1e2530;color:#fff;padding:10px 18px;border-radius:99px;font-size:14.5px;transition:all .25s;z-index:99;
  }
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0);}
</style>
</head>
<body>
<header>
  <div class="head-in">
    <div class="brand">바이브코딩 기획 도우미<small>질문에 답하면 프롬프트가 완성됩니다</small></div>
    <div class="head-btns">
      <button id="btnReset">처음부터</button>
    </div>
  </div>
  <div class="progress"><div id="prog"></div></div>
</header>

<main>
  <div class="layout">
    <section id="stage"></section>
    <aside>
      <div class="card">
        <h3>지금까지 정리한 기획</h3>
        <div id="summary" class="sum-list"><div class="sum-empty">답을 하나씩 채우면 여기에 기획서가 만들어져요.</div></div>
      </div>
    </aside>
  </div>
</main>
<div id="toast" class="toast"></div>

<script>
/* =========================================================
   1. 질문 정의
   ========================================================= */
const TYPES = [
  {id:'bingo', em:'🎯', label:'빙고 게임', desc:'수업이나 모임에서 다 같이 하는 빙고'},
  {id:'quiz',  em:'❓', label:'퀴즈 게임', desc:'OX · 4지선다 · 초성 퀴즈'},
  {id:'poll',  em:'📊', label:'실시간 투표·설문', desc:'참여자 의견을 한 화면에 모으기'},
  {id:'tool',  em:'🧰', label:'수업 도구', desc:'이름 뽑기 · 팀 나누기 · 타이머'},
  {id:'diary', em:'📒', label:'나만의 기록장', desc:'할 일 · 일기 · 가계부 · 독서 기록'},
];

// 공통 질문 (모든 유형)
const COMMON = [
  {id:'users', text:'이 앱은 주로 누가 쓰나요?', hint:'사용자가 누구인지에 따라 글씨 크기와 말투가 달라져요.', type:'single', custom:true,
    options:['초등학생','중·고등학생','성인 수강생','어르신','나 혼자','누구나']},
  {id:'situation', text:'어떤 상황에서 쓰나요?', type:'single', custom:true,
    options:['교실·강의실 수업 중','모임·행사','집에서 혼자','온라인 수업(줌 등)']},
  {id:'device', text:'어떤 기기로 쓰나요?', type:'single',
    options:['주로 스마트폰','주로 PC·노트북','PC와 스마트폰 둘 다','TV·빔프로젠터 큰 화면']},
  {id:'storage', text:'데이터는 어떻게 다룰까요?', hint:'잘 모르면 첫 번째를 고르세요. 나중에 바꿀 수 있어요.', type:'single',
    options:[
      {v:'none', label:'저장 안 해도 돼요', ds:'새로고침하면 처음으로 돌아가도 괜찮아요'},
      {v:'local', label:'이 기기에만 저장', ds:'다음에 열어도 내용이 남아 있어요 (로그인 없음)'},
      {v:'realtime', label:'여러 사람이 동시에 접속해서 실시간 공유', ds:'진행자 화면과 참여자 폰이 연결돼요'},
    ],
    when: a => !derivedStorage(a)},
  {id:'mood', text:'디자인 분위기는 어떤 게 좋아요?', type:'single', custom:true,
    options:['밝고 귀엽게','깔끔하고 심플하게','화려한 게임 느낌','차분하고 어른스럽게']},
  {id:'color', text:'포인트 색상을 골라주세요', type:'single', custom:true,
    options:['파란색','노란색','초록색','보라색','주황색','핑크색']},
  {id:'fontsize', text:'글씨와 버튼 크기는?', type:'single',
    options:['보통','크게 (누르기 쉽게)','아주 크게 (어르신·저학년용)']},
  {id:'appName', text:'앱 이름을 정해볼까요?', hint:'비워두면 자동으로 붙여드려요. 예: 우리반 빙고왕, 오늘의 한 줄', type:'text', optional:true, placeholder:'예: 우리반 빙고왕'},
  {id:'later', text:'나중에 추가하고 싶은 기능이 있나요?', hint:'한 줄에 하나씩 적어주세요. 처음 프롬프트에는 넣지 않고, "수정 요청 프롬프트"로 따로 만들어 드려요. 없으면 건너뛰어도 돼요.', type:'textarea', optional:true,
    placeholder:'예:\n효과음 넣기\n결과를 이미지로 저장하기\n다크모드'},
  {id:'tool', text:'어떤 AI 도구에 이 프롬프트를 넣을 건가요?', hint:'도구에 맞게 기술 요청 문장이 달라져요.', type:'single',
    options:['Claude (클로드)','ChatGPT','Gemini (제미나이)','Lovable (로바블)','기타·아직 안 정함']},
];

// 유형별 질문
const SPECIFIC = {
  bingo: [
    {id:'bingoMode', text:'빙고를 어떤 방식으로 하나요?', type:'single',
      options:[
        {v:'each', label:'각자 자기 폰으로', ds:'진행자가 부르면 참여자가 자기 빙고판을 체크'},
        {v:'one',  label:'한 화면(PC·TV)에서 다 같이', ds:'큰 화면에 빙고판 하나를 띄우고 함께 진행'},
      ]},
    {id:'bingoContent', text:'빙고 칸에는 무엇이 들어가나요?', type:'single', custom:true,
      options:['숫자 (1~25 등)','단어','그림·이모지']},
    {id:'bingoTopic', text:'단어나 그림의 주제는 무엇인가요?', hint:'AI가 이 주제로 칸 내용을 채워줘요.', type:'text', placeholder:'예: 동물 이름, 우리 반 친구 이름, 과일',
      examples:['동물 이름','과일·채소','우리 반 친구 이름','직업','나라 이름'],
      when: a => a.bingoContent && !a.bingoContent.startsWith('숫자')},
    {id:'bingoSize', text:'빙고판 크기는?', type:'single', options:['3×3 (9칸)','4×4 (16칸)','5×5 (25칸)']},
    {id:'bingoCaller', text:'번호(단어)는 누가 부르나요?', type:'single',
      options:[
        {v:'host', label:'진행자가 화면에서 "뽑기" 버튼으로', ds:'랜덤으로 하나씩 뽑혀요'},
        {v:'player', label:'참여자가 돌아가면서 직접 부르기', ds:'말로 부르고 각자 체크만'},
        {v:'auto', label:'자동으로 일정 시간마다', ds:'타이머처럼 저절로 진행'},
      ]},
    {id:'bingoWin', text:'몇 줄을 완성하면 빙고인가요?', type:'single', options:['1줄','2줄','3줄','시작할 때 고를 수 있게']},
  ],
  quiz: [
    {id:'quizFormat', text:'문제 형식은 무엇인가요?', hint:'여러 개 골라도 돼요.', type:'multi',
      options:['OX 퀴즈','4지선다','정답 직접 입력(단답형)','초성 퀴즈','그림 보고 맞히기']},
    {id:'quizSource', text:'문제는 어디서 오나요?', type:'single',
      options:[
        {v:'mine', label:'내가 직접 입력·수정', ds:'앱 안에서 문제를 추가하고 고칠 수 있어요'},
        {v:'preset', label:'미리 만들어진 예시 문제', ds:'AI가 주제에 맞게 10~20문제를 넣어줘요'},
        {v:'both', label:'둘 다', ds:'예시 문제가 있고, 내가 추가도 가능'},
      ]},
    {id:'quizTopic', text:'퀴즈 주제는 무엇인가요?', type:'text', placeholder:'예: AI 윤리, 초등 5학년 과학, 우리 회사 안전 규칙',
      examples:['AI 기초 상식','한국사','영어 단어','안전 교육','우리 동네 상식']},
    {id:'quizMode', text:'혼자 푸나요, 여러 명이 대결하나요?', type:'single',
      options:[
        {v:'solo', label:'혼자서 풀기', ds:'한 기기에서 혼자 문제 풀고 점수 확인'},
        {v:'screen', label:'한 화면으로 다 같이', ds:'큰 화면에 문제 띄우고 손들기·구두 답'},
        {v:'live', label:'각자 폰으로 실시간 대결', ds:'진행자 화면 + 참여자 폰, 순위 표시'},
      ]},
    {id:'quizExtra', text:'있으면 좋은 요소를 골라주세요', type:'multi', optional:true,
      options:['제한 시간(타이머)','점수·순위 표시','정답 해설 보여주기','효과음','틀린 문제 다시 풀기']},
  ],
  poll: [
    {id:'pollFormat', text:'어떤 형식의 질문을 낼 건가요?', type:'multi',
      options:['선택형(보기 중 하나)','자유 답변(짧은 글)','별점·점수 매기기','예/아니오']},
    {id:'pollResult', text:'결과는 어떻게 보여줄까요?', type:'multi',
      options:['막대그래프','원그래프','워드클라우드(자유 답변)','답변 목록으로 나열','숫자·퍼센트']},
    {id:'pollAnon', text:'참여자 이름을 받을까요?', type:'single',
      options:['익명으로','이름 또는 닉네임 입력','진행자가 선택할 수 있게']},
    {id:'pollJoin', text:'참여자는 어떻게 들어오나요?', type:'multi',
      options:['참여 코드 입력','QR코드 스캔','링크 클릭']},
  ],
  tool: [
    {id:'toolKind', text:'어떤 도구가 필요한가요?', hint:'여러 개 고르면 한 앱에 탭으로 묶어드려요.', type:'multi', custom:true,

/* 저장 방식이 앞 답변으로 이미 정해지는 경우 */
function derivedStorage(a){
  if(a.type==='poll') return 'realtime';
  if(a.type==='bingo' && a.bingoMode==='each') return 'realtime';
  if(a.type==='quiz' && a.quizMode==='live') return 'realtime';
  if(a.type==='diary') return a.diaryStore==='cloud' ? 'cloud' : 'local';
  return null;
}
function storageOf(a){ return derivedStorage(a) || a.storage || 'none'; }

/* 한국어 조사 자동 선택: josa('학생','이/가') → '학생이' */
function josa(word, pair){
  const w=String(word||'').replace(/[)\]）]+$/,'');
  const ch=w[w.length-1]; const [a,b]=pair.split('/');
  if(!ch) return word+a;
  const code=ch.charCodeAt(0);
  if(code<0xAC00||code>0xD7A3) return word+a; // 한글 아니면 앞 것
  const jong=(code-0xAC00)%28;
  if(pair==='으로/로') return word+(jong===0||jong===8?'로':'으로');
  return word+(jong>0?a:b);
}
/* "누가" 표현 */
function who(a){
  const u=a.users||'누구나';
  if(u==='나 혼자') return '내가';
  if(u==='누구나') return '누구나';
  return josa(u,'이/가');
}
/* "어디서" 표현 */
function where(a){
  const s=a.situation||'';
  if(!s) return '';
  if(/혼자$/.test(s)) return s+' ';
  if(/중$/.test(s)) return s+'에 ';
  return josa(s,'에서/에서').replace(/에서$/,'에서 ');
}

const KEY='vibe-planner-v1';
let S = load() || {answers:{}, step:-1, done:false};
function save(){ try{ localStorage.setItem(KEY, JSON.stringify(S)); }catch(e){} }
function load(){ try{ return JSON.parse(localStorage.getItem(KEY)); }catch(e){ return null; } }

const TYPE_Q = {id:'type', text:'어떤 종류의 웹앱을 만들어 볼까요?', hint:'가장 끌리는 걸 고르세요. 없으면 맨 아래에 직접 적어도 돼요.', type:'type'};

function steps(){
  const a=S.answers;
  const list=[TYPE_Q];
  if(!a.type) return list;
  const sp = SPECIFIC[a.type] || [];
  return list.concat(sp, COMMON).filter(q => !q.when || q.when(a));
}
function labelOf(q, v){
  if(v==null || v==='' || (Array.isArray(v)&&!v.length)) return '';
  if(q.type==='type'){ const t=TYPES.find(t=>t.id===v); return t? t.label : '직접 입력: '+(S.answers.customTitle||''); }
  const find = x => { const o=(q.options||[]).find(o=>typeof o==='object' && o.v===x); return o? o.label : x; };
  return Array.isArray(v) ? v.map(find).join(', ') : find(v);
}

const stage=document.getElementById('stage');

function render(){
  save();
  const list=steps();
  if(S.done){ renderResult(); prog.style.width='100%'; renderSummary(); return; }
  if(S.step<0){ renderIntro(); prog.style.width='0%'; renderSummary(); return; }
  if(S.step>=list.length){ S.done=true; render(); return; }
  const q=list[S.step];
  prog.style.width = Math.round((S.step)/(list.length)*100)+'%';
  renderQuestion(q, S.step, list.length);
  renderSummary();
  window.scrollTo({top:0});
}

function renderQuestion(q, idx, total){
  const a=S.answers;
  const cur=a[q.id];
  let body='';
  if(q.type==='type'){
    body = `<div class="opts grid2">`+TYPES.map(t=>`
      <button class="opt ${cur===t.id?'on':''}" data-v="${t.id}">
        <span class="em">${t.em}</span><span><span class="lb">${t.label}</span><span class="ds">${t.desc}</span></span>
      </button>`).join('')+
      `<button class="opt custom ${cur==='custom'?'on':''}" data-v="custom"><span class="em">✏️</span><span><span class="lb">직접 입력</span><span class="ds">내가 생각한 앱을 한 줄로</span></span></button>
      </div>
      <div class="custom-box" id="customBox" ${cur==='custom'?'':'hidden'}>
        <input class="inp" id="customInp" placeholder="예: 우리 동네 맛집 기록 앱, 단어 암기 카드" value="${esc(a.customTitle||'')}">
        <div class="example">Enter를 누르면 다음으로 넘어가요.</div>
      </div>`;
  }
  else if(q.type==='single' || q.type==='multi'){
    const isMulti=q.type==='multi';
    const sel = isMulti ? (Array.isArray(cur)?cur:[]) : cur;
    const isCustomSel = !isMulti && cur!=null && cur!=='' && !(q.options||[]).some(o=> (typeof o==='object'?o.v:o)===cur);
    const customVal = isMulti ? (sel.find(v=>!(q.options||[]).some(o=>(typeof o==='object'?o.v:o)===v))||'') : (isCustomSel?cur:'');
    body = `<div class="opts">`+q.options.map(o=>{
      const v=typeof o==='object'?o.v:o, lb=typeof o==='object'?o.label:o, ds=typeof o==='object'?o.ds:'';
      const on = isMulti ? sel.includes(v) : cur===v;
      return `<button class="opt ${on?'on':''}" data-v="${esc(v)}">${isMulti?'<span class="chk"></span>':''}<span><span class="lb">${lb}</span>${ds?`<span class="ds">${ds}</span>`:''}</span></button>`;
    }).join('')+
    (q.custom?`<button class="opt custom ${customVal?'on':''}" data-v="__custom">${isMulti?'<span class="chk"></span>':''}<span><span class="lb">직접 입력</span></span></button>`:'')+
    `</div>`+
    (q.custom?`<div class="custom-box" id="customBox" ${customVal?'':'hidden'}><input class="inp" id="customInp" placeholder="직접 입력하고 Enter" value="${esc(customVal)}"></div>`:'');
  }
  else if(q.type==='text'){
    body = `<input class="inp" id="textInp" placeholder="${esc(q.placeholder||'')}" value="${esc(cur||'')}">
      ${q.examples?`<div class="example">예시를 눌러도 돼요<div class="ex-chips">${q.examples.map(e=>`<button data-ex="${esc(e)}">${e}</button>`).join('')}</div></div>`:''}
      <div class="example">Enter를 누르면 다음으로 넘어가요.</div>`;
  }
  else if(q.type==='textarea'){
    body = `<textarea class="inp" id="textInp" placeholder="${esc(q.placeholder||'')}">${esc(cur||'')}</textarea>
      <div class="example">Ctrl + Enter로 다음으로 넘어가요.</div>`;
  }

  const isMulti = q.type==='multi';
  const canNext = ()=> {
    const v=S.answers[q.id];
    if(q.optional) return true;
    if(q.type==='type') return !!v && (v!=='custom' || (S.answers.customTitle||'').trim());
    if(Array.isArray(v)) return v.length>0;
    return v!=null && String(v).trim()!=='';
  };

  stage.innerHTML=`
  <div class="card">
    <span class="step-tag">질문 ${idx+1} / ${total}</span>
    <h2>${q.text}</h2>
    ${q.hint?`<p class="hint">${q.hint}</p>`:'<div style="height:14px"></div>'}
    ${body}
    <div class="nav-row">
      <button class="btn ghost" id="btnPrev">${idx===0?'처음으로':'← 이전'}</button>
      <span style="display:flex;gap:8px;align-items:center">
        ${q.optional?`<button class="btn ghost" id="btnSkip">건너뛰기</button>`:''}
        <button class="btn primary" id="btnNext" ${canNext()?'':'disabled'}>${isMulti||q.type==='textarea'?'다음 →':'다음 →'}</button>
      </span>
    </div>
  </div>`;

  const nextBtn=document.getElementById('btnNext');
  const refresh=()=>{ nextBtn.disabled=!canNext(); renderSummary(); save(); };
  const goNext=()=>{ if(!canNext()) return; S.step++; render(); };
  document.getElementById('btnPrev').onclick=()=>{ S.step= idx===0? -1 : S.step-1; render(); };
  const skip=document.getElementById('btnSkip'); if(skip) skip.onclick=()=>{ S.step++; render(); };
  nextBtn.onclick=goNext;

  // 옵션 클릭
  stage.querySelectorAll('.opt').forEach(btn=>{
    btn.onclick=()=>{
      const v=btn.dataset.v;
      const box=document.getElementById('customBox');
      if(q.type==='type'){
        S.answers.type=v;
        // 유형이 바뀌면 유형별 답 초기화
        Object.keys(SPECIFIC).forEach(t=>SPECIFIC[t].forEach(sq=>{ if(t!==v) delete S.answers[sq.id]; }));
        delete S.answers.storage;
        if(v==='custom'){ box.hidden=false; document.getElementById('customInp').focus(); highlight(); refresh(); return; }
        highlight(); refresh(); setTimeout(goNext,160); return;
      }
      if(v==='__custom'){
        box.hidden=false; document.getElementById('customInp').focus();
        if(!isMulti){ S.answers[q.id]=''; }
        highlight(); refresh(); return;
      }
      if(isMulti){
        const arr=Array.isArray(S.answers[q.id])?[...S.answers[q.id]]:[];
        const i=arr.indexOf(v); i>=0? arr.splice(i,1) : arr.push(v);
        S.answers[q.id]=arr; highlight(); refresh();
      }else{
        S.answers[q.id]=v; if(box) box.hidden=true; highlight(); refresh(); setTimeout(goNext,160);
      }
    };
  });
  function highlight(){
    stage.querySelectorAll('.opt').forEach(b=>{
      const v=b.dataset.v; let on=false;
      if(q.type==='type') on = S.answers.type===v;
      else if(isMulti) on = v==='__custom' ? !document.getElementById('customBox').hidden : (S.answers[q.id]||[]).includes(v);
      else on = v==='__custom' ? !document.getElementById('customBox').hidden : S.answers[q.id]===v;
      b.classList.toggle('on',on);
    });
  }

  // 직접 입력 박스
  const cInp=document.getElementById('customInp');
  if(cInp){
    if(isMulti) cInp.dataset.prev = cInp.value;
    cInp.oninput=()=>{
      const val=cInp.value;
      if(q.type==='type'){ S.answers.customTitle=val; }
      else if(isMulti){
        const arr=(S.answers[q.id]||[]).filter(x=> x!==cInp.dataset.prev && (q.options||[]).some(o=>(typeof o==='object'?o.v:o)===x));
        if(val.trim()) arr.push(val.trim());
        S.answers[q.id]=arr; cInp.dataset.prev=val.trim();
      }
      else { S.answers[q.id]=val; }
      refresh();
    };
    cInp.onkeydown=e=>{ if(e.key==='Enter' && !e.isComposing && e.keyCode!==229){ e.preventDefault(); goNext(); } };
  }
  // 텍스트 입력
  const tInp=document.getElementById('textInp');
  if(tInp){
    tInp.oninput=()=>{ S.answers[q.id]=tInp.value; refresh(); };
    tInp.onkeydown=e=>{
      if(e.key!=='Enter' || e.isComposing || e.keyCode===229) return;
      if(q.type==='textarea'){ if(e.ctrlKey||e.metaKey){ e.preventDefault(); goNext(); } return; }
      e.preventDefault(); goNext();
    };
    setTimeout(()=>tInp.focus(),50);
    stage.querySelectorAll('[data-ex]').forEach(b=>b.onclick=()=>{ tInp.value=b.dataset.ex; S.answers[q.id]=b.dataset.ex; refresh(); setTimeout(goNext,120); });
  }
}

function renderSummary(){
  const el=document.getElementById('summary');
  const list=steps();
  const items=list.map((q,i)=>({q,i,v:labelOf(q,S.answers[q.id])})).filter(x=>x.v);
  if(!items.length){ el.innerHTML='<div class="sum-empty">답을 하나씩 채우면 여기에 기획서가 만들어져요.</div>'; return; }
  el.innerHTML=items.map(x=>`<div class="sum-item" data-i="${x.i}"><div class="k">${shortQ(x.q)}</div><div class="v">${esc(x.v)}</div></div>`).join('');
  el.querySelectorAll('.sum-item').forEach(d=>d.onclick=()=>{ S.done=false; S.step=+d.dataset.i; render(); });
}

  };
  (generic[t]||generic.custom).forEach(g=>{ if(follow.length<6) follow.push(g); });
  follow.push('모바일에서 열었을 때 화면이 깨지는 부분을 찾아서 고쳐줘.');

  return {name, intro, prompt, follow, st};
}
function defaultName(a){
  return ({bingo:'우리 빙고', quiz:'도전 퀴즈', poll:'실시간 한마음 투표', tool:'수업 도구함', diary:'나의 기록장'})[a.type] || (a.customTitle||'나의 웹앱');
}

/* =========================================================
   5. 결과 화면
   ========================================================= */
function renderResult(){
  const a=S.answers, list=steps();
  const g=gen();
  const rows=list.filter(q=>labelOf(q,a[q.id])).map(q=>`<tr><th>${shortQ(q)}</th><td>${esc(labelOf(q,a[q.id])).replace(/\n/g,'<br>')}</td></tr>`).join('');
  const stLabel={none:'저장 없음',local:'이 기기에 저장',realtime:'실시간 공유(여러 사람)',cloud:'로그인·클라우드 저장'}[g.st];
  stage.innerHTML=`
  <div class="card result">
    <span class="step-tag">완성</span>
    <h2>"${esc(g.name)}" 기획이 정리됐어요</h2>
    <p class="hint">아래 프롬프트를 복사해서 ${esc(a.tool||'AI 도구')}에 붙여넣으세요. 마음에 안 드는 답은 오른쪽 요약에서 눌러 바꿀 수 있어요.</p>

    <div class="sec-h">1. 한 장 기획서</div>
    <table class="plan-table">
      <tr><th>한 줄 소개</th><td>${esc(g.intro)}</td></tr>
      ${rows}
      <tr><th>데이터 방식</th><td>${stLabel}</td></tr>
    </table>

    <div class="sec-h">2. AI에게 보낼 프롬프트<small>이걸 그대로 붙여넣으세요</small></div>
    <div class="prompt-wrap">
      <button class="copy-btn" id="copyMain">복사하기</button>
      <pre class="prompt" id="promptText">${esc(g.prompt)}</pre>
    </div>

    <div class="sec-h">3. 고쳐가며 완성하기<small>기본 버전이 나온 뒤, 채팅에 이어서 하나씩</small></div>
    <div class="follow">
      ${g.follow.map((f,i)=>`<div class="follow-item"><code>${esc(f)}</code><button data-copy="${esc(f)}">복사</button></div>`).join('')}
    </div>

    <div class="tip"><b>바이브코딩 꿀팁</b>한 번에 완벽하게 나오지 않아요. 만들고 → 보고 → "이렇게 바꿔줘"를 반복하는 게 바이브코딩이에요. 오류가 나면 오류 메시지를 그대로 복사해서 붙여넣고 "이 오류를 고쳐줘"라고 하면 됩니다.</div>

    <div class="result-actions">
      <button class="btn ghost" id="btnEdit">← 답 수정하기</button>
      <button class="btn ghost" id="btnDown">기획서+프롬프트 파일로 저장</button>
      <button class="btn ghost" id="btnNew">새로 만들기</button>
    </div>
  </div>`;

  document.getElementById('copyMain').onclick=e=>copyText(g.prompt, e.target, '복사 완료!');
  stage.querySelectorAll('[data-copy]').forEach(b=>b.onclick=()=>copyText(b.dataset.copy,b,'완료'));
  document.getElementById('btnEdit').onclick=()=>{ S.done=false; S.step=list.length-1; render(); };
  document.getElementById('btnNew').onclick=twoClick(()=>{ S={answers:{},step:-1,done:false}; render(); }, '정말 새로 만들까요? (다시 클릭)');
  document.getElementById('btnDown').onclick=()=>{
    const planTxt = list.filter(q=>labelOf(q,a[q.id])).map(q=>`- ${shortQ(q)}: ${labelOf(q,a[q.id])}`).join('\n');
    const md = `# ${g.name} — 바이브코딩 기획서\n\n## 한 줄 소개\n${g.intro}\n\n## 기획 요약\n${planTxt}\n- 데이터 방식: ${stLabel}\n\n## AI에게 보낼 프롬프트\n\n\`\`\`\n${g.prompt}\n\`\`\`\n\n## 고쳐가며 완성하기\n${g.follow.map(f=>`- ${f}`).join('\n')}\n`;
    const blob=new Blob(['﻿'+md],{type:'text/markdown;charset=utf-8'});
    const u=URL.createObjectURL(blob); const link=document.createElement('a'); link.href=u; link.download=`${g.name}_기획서.md`; document.body.appendChild(link); link.click(); link.remove(); setTimeout(()=>URL.revokeObjectURL(u),500);
    toast('파일을 저장했어요');
  };
}

/* =========================================================
   6. 유틸
   ========================================================= */
function esc(s){ return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function toast(msg){ const t=document.getElementById('toast'); t.textContent=msg; t.classList.add('show'); clearTimeout(t._t); t._t=setTimeout(()=>t.classList.remove('show'),1600); }
async function copyText(text, btn, doneLabel){
  try{ await navigator.clipboard.writeText(text); }
  catch(e){ const ta=document.createElement('textarea'); ta.value=text; document.body.appendChild(ta); ta.select(); document.execCommand('copy'); ta.remove(); }
  const orig=btn.textContent; btn.textContent=doneLabel; btn.classList.add('done'); toast('클립보드에 복사했어요');
  setTimeout(()=>{ btn.textContent=orig; btn.classList.remove('done'); },1500);
}
// confirm() 대신: 첫 클릭은 경고 문구, 3초 안에 다시 클릭하면 실행
function twoClick(fn, msg){
  return function(e){
    const b=e.currentTarget;
    if(b.dataset.armed){ delete b.dataset.armed; b.textContent=b.dataset.orig; b.classList.remove('danger'); fn(); return; }
    b.dataset.armed='1'; b.dataset.orig=b.textContent; b.textContent=msg; b.classList.add('danger');
    setTimeout(()=>{ if(b.dataset.armed){ delete b.dataset.armed; b.textContent=b.dataset.orig; b.classList.remove('danger'); } },3000);
  };
}
document.getElementById('btnReset').onclick=twoClick(()=>{ S={answers:{},step:-1,done:false}; render(); }, '정말 지울까요? (다시 클릭)');

render();
</script>
